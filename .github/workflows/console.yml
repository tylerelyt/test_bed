name: Next.js workbench
on:
  push:
    paths: ['console/**', 'src/search_engine/**', 'tests/**', 'tools/verify_console_migration.py', 'requirements-console.txt', '.github/workflows/console.yml']
  pull_request:
    paths: ['console/**', 'src/search_engine/**', 'tests/**', 'tools/verify_console_migration.py', 'requirements-console.txt', '.github/workflows/console.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'gradio==4.44.1' 'huggingface-hub<1' 'pydantic==2.11.10' 'fastapi==0.116.1' 'numpy<2'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npm run build
        working-directory: console
