name: Next.js workbench
on:
  push:
    paths: ['console/**', 'src/search_engine/**', 'tests/**', 'tools/verify_console_migration.py', 'tools/console_fixture.py', 'tools/manage_workbench_access.py', 'requirements-console.txt', 'requirements-platform.txt', 'requirements-core.txt', 'start_console.sh', 'runtimes/**', 'tools/harness_test_model.py', 'tools/start_platform_db.py', '.github/workflows/console.yml']
  pull_request:
    paths: ['console/**', 'src/search_engine/**', 'tests/**', 'tools/verify_console_migration.py', 'tools/console_fixture.py', 'tools/manage_workbench_access.py', 'requirements-console.txt', 'requirements-platform.txt', 'requirements-core.txt', 'start_console.sh', 'runtimes/**', 'tools/harness_test_model.py', 'tools/start_platform_db.py', '.github/workflows/console.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: runtimes/pi
      - run: python -m pip install -r requirements-core.txt 'gradio==4.44.1' 'huggingface-hub<1' 'numpy<2'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm ci
        working-directory: console
      - run: npm run build
        working-directory: console
      - run: npx playwright install --with-deps chromium
        working-directory: console
      - run: npm run test:e2e
        working-directory: console
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-browser-evidence
          path: |
            console/playwright-report/
            console/test-results/
